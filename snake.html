<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake - GameWorld</title>

<style>
body {
    background: #111827;
    color: white;
    text-align: center;
    font-family: Arial;
}

h1 {
    color: #22c55e;
}

canvas {
    background: black;
    border: 3px solid #22c55e;
    margin-top: 20px;
}
</style>

</head>

<body>

<h1>🐍 Snake</h1>
<p>Usa le frecce per muovere il serpente</p>

<canvas id="game" width="300" height="300"></canvas>
<div>
<button onclick="dx=0;dy=-10">⬆️</button>
</div>

<div>
<button onclick="dx=-10;dy=0">⬅️</button>
<button onclick="dx=0;dy=10">⬇️</button>
<button onclick="dx=10;dy=0">➡️</button>
</div>
<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let snake = [{x:150,y:150}];
let food = {x:50,y:50};
let dx = 10;
let dy = 0;

function game(){

ctx.fillStyle="black";
ctx.fillRect(0,0,300,300);

ctx.fillStyle="red";
ctx.fillRect(food.x,food.y,10,10);

ctx.fillStyle="#22c55e";

snake.forEach(part=>{
ctx.fillRect(part.x,part.y,10,10);
});

let head = {
x: snake[0].x + dx,
y: snake[0].y + dy
};

snake.unshift(head);

if(head.x===food.x && head.y===food.y){
food={
x:Math.floor(Math.random()*30)*10,
y:Math.floor(Math.random()*30)*10
};
}else{
snake.pop();
}

if(
head.x<0 || head.x>=300 ||
head.y<0 || head.y>=300
){
alert("Game Over!");
location.reload();
}

}

document.addEventListener("keydown", e=>{
if(e.key==="ArrowUp"){dx=0;dy=-10;}
if(e.key==="ArrowDown"){dx=0;dy=10;}
if(e.key==="ArrowLeft"){dx=-10;dy=0;}
if(e.key==="ArrowRight"){dx=10;dy=0;}
});

setInterval(game,100);

</script>

</body>
</html>
