<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameWorld</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
}

header {
    background: #2563eb;
    padding: 20px;
    text-align: center;
    font-size: 30px;
    font-weight: bold;
}

.search {
    text-align: center;
    margin: 20px;
}

input {
    padding: 12px;
    width: 80%;
    border-radius: 10px;
    border: none;
}

.games {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 20px;
}

.game {
    background: #1f2937;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
}

button {
    background: #22c55e;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 8px;
}
</style>
</head>

<body>

<header>
🎮 GameWorld
</header>

<div class="search">
<input placeholder="Cerca un gioco...">
</div>

<div class="games">

<div class="game">
<h2>🐍 Snake</h2>
<p>Gioca al classico Snake</p>
<button>Gioca</button>
</div>

<div class="game">
<h2>🧩 Puzzle</h2>
<p>Metti alla prova la tua mente</p>
<button>Gioca</button>
</div>

<div class="game">
<h2>🚗 Corse</h2>
<p>Gare ad alta velocità</p>
<button>Gioca</button>
</div>

<div class="game">
<h2>⚔️ Azione</h2>
<p>Avventure e combattimenti</p>
<button>Gioca</button>
</div>

</div>

</body>
</html>
