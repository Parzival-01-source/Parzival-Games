<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameWorld - Snake</title>


<style>

body{
    background:#111827;
    color:white;
    text-align:center;
    font-family:Arial;
    touch-action:none;
}


h1{
    color:#22c55e;
}


button{

    border:none;
    border-radius:20px;
    background:#22c55e;
}


#start{

    width:240px;
    height:90px;
    font-size:40px;
    font-weight:bold;

}



canvas{

    display:none;

    background:black;

    border:4px solid #22c55e;

    border-radius:20px;

}



.control{

    width:90px;
    height:70px;

    margin:5px;

    font-size:40px;

}



#gameArea{

    display:none;

}


</style>

</head>


<body>


<div id="home">


<h1>🎮 GameWorld</h1>

<h2>🐍 Snake</h2>


<button id="start" onclick="startGame()">

▶️ GIOCA

</button>


</div>





<div id="gameArea">


<h1>🎮 GameWorld</h1>


<h2>🐍 Snake</h2>


<p>

Punteggio:
<span id="score">0</span>

</p>


<canvas id="game" width="300" height="300"></canvas>



<div>

<button class="control" onclick="move(0,-10)">⬆️</button>

</div>


<div>

<button class="control" onclick="move(-10,0)">⬅️</button>

<button class="control" onclick="move(0,10)">⬇️</button>

<button class="control" onclick="move(10,0)">➡️</button>

</div>


<button class="control" onclick="restart()">🔄</button>


</div>




<script>


const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");


let snake;

let food;

let dx;

let dy;

let score;

let timer;




function startGame(){

document.getElementById("home").style.display="none";

document.getElementById("gameArea").style.display="block";

canvas.style.display="inline";


restart();

}




function restart(){


snake=[

{x:150,y:150},

{x:140,y:150},

{x:130,y:150}

];


food={

x:Math.floor(Math.random()*28)*10,

y:Math.floor(Math.random()*28)*10

};


dx=10;

dy=0;


score=0;


document.getElementById("score").innerHTML=score;


clearInterval(timer);


timer=setInterval(game,120);


}






function move(x,y){


if(x===-dx && y===-dy)

return;


dx=x;

dy=y;


}





function game(){


ctx.fillStyle="black";

ctx.fillRect(0,0,300,300);




// 🍎 mela grande


ctx.font="32px Arial";

ctx.fillText(

"🍎",

food.x-8,

food.y+30

);





// 🐍 serpente grande


snake.forEach((part,index)=>{


if(index===0){


// testa grande

ctx.font="32px Arial";

ctx.fillText(

"🐍",

part.x-8,

part.y+30

);



}else{


// corpo altri serpenti


ctx.font="22px Arial";

ctx.fillText(

"🐍",

part.x-5,

part.y+22

);



}


});






let head={

x:snake[0].x+dx,

y:snake[0].y+dy

};




snake.unshift(head);





if(head.x===food.x && head.y===food.y){


score++;


document.getElementById("score").innerHTML=score;


food={

x:Math.floor(Math.random()*28)*10,

y:Math.floor(Math.random()*28)*10

};


}else{


snake.pop();


}





if(

head.x<0 ||

head.y<0 ||

head.x>=300 ||

head.y>=300 ||

snake.slice(1).some(p=>p.x===head.x && p.y===head.y)

){


alert(

"Game Over! Punteggio: "+score

);


restart();


}


}






// tastiera


document.addEventListener("keydown",e=>{


if(e.key==="ArrowUp")

move(0,-10);


if(e.key==="ArrowDown")

move(0,10);


if(e.key==="ArrowLeft")

move(-10,0);


if(e.key==="ArrowRight")

move(10,0);


});






// swipe iPhone


let startX=0;

let startY=0;


canvas.addEventListener("touchstart",e=>{


startX=e.touches[0].clientX;

startY=e.touches[0].clientY;


});



canvas.addEventListener("touchend",e=>{


let x=e.changedTouches[0].clientX-startX;

let y=e.changedTouches[0].clientY-startY;



if(Math.abs(x)>Math.abs(y)){


if(x>30)

move(10,0);


if(x<-30)

move(-10,0);


}else{


if(y>30)

move(0,10);


if(y<-30)

move(0,-10);


}


});


</script>


</body>

</html>
